<!DOCTYPE html>
<html>

<head>
  <title>Servicio Técnico</title>

  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
    }

    .card {
      background-color: white;
      color: black;
      padding: 25px;
      margin: 50px auto;
      border-radius: 15px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #444;
    }

    button {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1ebe5d;
    }

    img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }
  </style>

</head>

<body>

  <div class="card">
    <h1>Servicio Técnico</h1>
    <h2>Thomás Padial</h2>

    <p>Reparación de PC a domicilio</p>
    <p>Formateo • Limpieza • Componentes • Inspección</p>

    <a href="https://wa.me/541173610086" target="_blank">
      <button>Contactame por WhatsApp</button>
    </a>

    <img src="https://via.placeholder.com/300x200">
  </div>

</body>

</html>
